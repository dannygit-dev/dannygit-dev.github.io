<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Weekly Routine</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1c1c1a;padding-bottom:20px}
button{cursor:pointer;font:inherit;border:none;background:none}
input,select,textarea{font:inherit}

/* ── HEADER ── */
.hdr{background:#1a2e1a;padding:14px 16px 10px;position:sticky;top:0;z-index:50}
.hdr h1{font-size:16px;font-weight:600;color:#e8f5e9;letter-spacing:-.2px}
.hdr p{font-size:11px;color:#86efac;margin-top:1px}

/* ── WEEK STRIP ── */
.week-strip{display:flex;background:#fff;border-bottom:1px solid #e5e3db;overflow-x:auto;scrollbar-width:none}
.week-strip::-webkit-scrollbar{display:none}
.day-tab{flex:1;min-width:46px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;color:#9ca3af}
.day-tab.active{border-bottom-color:#1a2e1a;color:#1a2e1a}
.day-tab .day-label{font-size:12px;font-weight:600}
.day-tab .day-type{font-size:9px;font-weight:500;padding:1px 5px;border-radius:3px;white-space:nowrap}

/* ── DAY VIEW ── */
.day-toolbar{display:flex;align-items:center;gap:8px;padding:12px 14px 6px}
.day-title{font-size:15px;font-weight:600;flex:1}
.btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;transition:opacity .15s}
.btn:active{opacity:.75}
.btn-primary{background:#1a2e1a;color:#e8f5e9}
.btn-ghost{background:transparent;border:1px solid #e5e3db;color:#374151}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}

/* ── TIMELINE ── */
.timeline{padding:6px 14px 14px}
.tl-event{display:flex;gap:11px;align-items:flex-start;margin-bottom:2px;position:relative;cursor:pointer}
.tl-event:hover .ev-card{background:#f9fafb}
.tl-time-col{min-width:60px;text-align:right;padding-top:11px}
.tl-time{font-size:11px;color:#9ca3af;font-variant-numeric:tabular-nums}
.tl-track{display:flex;flex-direction:column;align-items:center;padding-top:11px}
.tl-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.tl-line{width:1px;height:100%;min-height:18px;background:#e5e3db;margin-top:2px;flex:1}
.ev-card{flex:1;background:#fff;border:1px solid #e5e3db;border-radius:9px;padding:8px 10px;margin-bottom:6px;min-height:38px}
.ev-label{font-size:13px;font-weight:500;color:#1c1c1a;line-height:1.3}
.ev-notes{font-size:11px;color:#9ca3af;margin-top:2px;line-height:1.4}
.ev-edit{opacity:0;font-size:14px;color:#d1d5db;padding:4px;transition:opacity .15s;flex-shrink:0;margin-top:7px}
.tl-event:hover .ev-edit{opacity:1}
.empty-day{text-align:center;padding:40px 20px;color:#9ca3af;font-size:14px}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.overlay.hidden{display:none}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 16px 36px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{font-size:12px;color:#6b7280;display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid #e5e3db;border-radius:8px;padding:9px 10px;font-size:14px;background:#f9fafb}
.field textarea{resize:none;height:70px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #1a2e1a;background:#fff}
.cat-grid{display:flex;flex-wrap:wrap;gap:6px}
.cat-chip{padding:5px 11px;border-radius:16px;font-size:12px;font-weight:500;cursor:pointer;border:2px solid transparent;transition:all .15s}
.cat-chip.selected{border-color:rgba(0,0,0,.25)}
.modal-actions{display:flex;gap:8px;margin-top:4px}
.modal-actions .btn{flex:1;justify-content:center}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5}

/* ── COPY MENU ── */
.copy-menu{background:#fff;border:1px solid #e5e3db;border-radius:10px;position:absolute;right:14px;top:44px;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.1);min-width:140px}
.copy-menu.hidden{display:none}
.copy-item{padding:10px 14px;font-size:13px;cursor:pointer;color:#374151}
.copy-item:hover{background:#f5f4f0}
.copy-item:first-child{border-radius:10px 10px 0 0}
.copy-item:last-child{border-radius:0 0 10px 10px}
</style>
</head>
<body>

<div class="hdr">
  <h1>Weekly Routine</h1>
  <p>Tap any event to edit · Tap + to add</p>
</div>

<div class="week-strip" id="week-strip"></div>

<div class="day-toolbar">
  <div class="day-title" id="day-title"></div>
  <div style="position:relative">
    <button class="btn btn-ghost btn-sm" onclick="toggleCopyMenu()" id="copy-btn">Copy ▾</button>
    <div class="copy-menu hidden" id="copy-menu"></div>
  </div>
  <button class="btn btn-primary btn-sm" onclick="openModal(null)">+ Add</button>
</div>

<div class="timeline" id="timeline"></div>

<div class="overlay hidden" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
// ── CATEGORIES ────────────────────────────────────────────────────────────────
const CATS={
  sleep:    {label:'Sleep',    color:'#e24b4a',bg:'#fef2f2'},
  nutrition:{label:'Nutrition',color:'#16a34a',bg:'#f0fdf4'},
  training: {label:'Training', color:'#6d28d9',bg:'#f5f3ff'},
  work:     {label:'Work',     color:'#1d4ed8',bg:'#eff6ff'},
  reading:  {label:'Reading',  color:'#d97706',bg:'#fffbeb'},
  recovery: {label:'Recovery', color:'#0f766e',bg:'#f0fdfa'},
  other:    {label:'Other',    color:'#6b7280',bg:'#f9fafb'},
};
const DAY_KEYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_NAMES={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};

// ── DEFAULT DATA ──────────────────────────────────────────────────────────────
function defaultData(){
  const uid=()=>Math.random().toString(36).slice(2,8);
  const ev=(time,label,notes,cat)=>({id:uid(),time,label,notes:notes||'',cat});

  const workday=(gymLabel)=>[
    ev('06:30','Wake up','Phone face-down until after reading','sleep'),
    ev('06:30','Reading — 30 min','No screens · book or e-reader only','reading'),
    ev('07:00','Morning protein','Shake + banana · grab-and-go','nutrition'),
    ev('07:20','Leave for work','40 min commute','work'),
    ev('08:00','Work begins','First 15 min: write 3 priorities','work'),
    ev('10:00','Mid-morning snack','Protein bar or shake + fruit','nutrition'),
    ev('12:00','Lunch','~35g protein · anchor meal','nutrition'),
    ev('15:30','Pre-workout snack','Carb-forward · ~20g protein','nutrition'),
    ev('17:00','Work ends','Head home · change into gym clothes','work'),
    ev('17:40',gymLabel||'Gym','60–75 min session','training'),
    ev('19:00','Post-workout dinner','~45g protein · carb-heavy','nutrition'),
    ev('21:30','Pre-bed snack (opt.)','Casein or cottage cheese','nutrition'),
    ev('22:00','Lights out','8 hrs sleep target','sleep'),
  ];

  return{
    Mon:workday('Gym — Quads'),
    Tue:workday('Gym — Push A'),
    Wed:[
      ev('06:30','Wake up','','sleep'),
      ev('06:30','Reading — 30 min','No screens · book only','reading'),
      ev('07:00','Morning protein','Shake + banana','nutrition'),
      ev('07:20','Leave for work','40 min commute','work'),
      ev('08:00','Work begins','','work'),
      ev('10:00','Mid-morning snack','Protein bar or shake','nutrition'),
      ev('12:00','Lunch','~35g protein','nutrition'),
      ev('15:30','Afternoon snack','Light · ~20g protein','nutrition'),
      ev('17:00','Work ends','','work'),
      ev('17:30','Active recovery','Walk, foam roll, or mobility work','recovery'),
      ev('19:00','Dinner','','nutrition'),
      ev('22:00','Lights out','','sleep'),
    ],
    Thu:workday('Gym — Pull A + Hams'),
    Fri:workday('Gym — Push B'),
    Sat:[
      ev('07:00','Wake up','Natural wake — within 1 hr of weekday','sleep'),
      ev('07:00','Reading — 30 min','Same habit, no alarm pressure','reading'),
      ev('08:00','Morning meal','First real meal · optional sit-down','nutrition'),
      ev('10:30','Gym — Pull B','60–75 min','training'),
      ev('13:00','Lunch','','nutrition'),
      ev('18:30','Dinner','','nutrition'),
      ev('22:00','Lights out','','sleep'),
    ],
    Sun:[
      ev('07:30','Wake up','Natural wake','sleep'),
      ev('07:30','Reading — 30 min','','reading'),
      ev('08:30','Morning meal','','nutrition'),
      ev('14:00','Meal prep','Batch cook protein, rice, vegetables','other'),
      ev('18:30','Dinner','','nutrition'),
      ev('21:00','Weekly review','Check PRs · plan next week · set intentions','other'),
      ev('22:00','Lights out','Consistent bedtime protects the week','sleep'),
    ],
  };
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let schedule=JSON.parse(localStorage.getItem('routine-v1')||'null')||defaultData();
let activeDay='Mon';
let editingId=null;

function save(){localStorage.setItem('routine-v1',JSON.stringify(schedule));}
function sortDay(day){schedule[day].sort((a,b)=>a.time.localeCompare(b.time));}

// ── TIME HELPERS ──────────────────────────────────────────────────────────────
function fmt12(t){
  if(!t)return'';
  const[h,m]=t.split(':').map(Number);
  const ap=h<12?'AM':'PM';
  const hr=h===0?12:h>12?h-12:h;
  return`${hr}:${String(m).padStart(2,'0')} ${ap}`;
}

// ── DAY TYPE LABEL (for week strip) ──────────────────────────────────────────
function getDayType(day){
  const evs=schedule[day]||[];
  const hasTrain=evs.some(e=>e.cat==='training');
  const hasRecov=evs.some(e=>e.cat==='recovery'&&!hasTrain);
  if(hasTrain){
    const t=evs.find(e=>e.cat==='training');
    const lbl=t.label.replace('Gym — ','').replace('Gym','Gym').slice(0,8);
    return{label:lbl,color:'#6d28d9',bg:'#ede9fe'};
  }
  if(hasRecov)return{label:'Active',color:'#0f766e',bg:'#ccfbf1'};
  const hasWork=evs.some(e=>e.cat==='work');
  if(!hasWork)return{label:'Rest',color:'#6b7280',bg:'#f3f4f6'};
  return{label:'Work',color:'#1d4ed8',bg:'#dbeafe'};
}

// ── RENDER WEEK STRIP ─────────────────────────────────────────────────────────
function renderStrip(){
  const el=document.getElementById('week-strip');
  el.innerHTML=DAY_KEYS.map(d=>{
    const t=getDayType(d);
    return`<button class="day-tab${d===activeDay?' active':''}" onclick="switchDay('${d}')">
      <span class="day-label">${d}</span>
      <span class="day-type" style="background:${t.bg};color:${t.color}">${t.label}</span>
    </button>`;
  }).join('');
}

// ── RENDER TIMELINE ───────────────────────────────────────────────────────────
function renderTimeline(){
  document.getElementById('day-title').textContent=DAY_NAMES[activeDay];
  const el=document.getElementById('timeline');
  const evs=schedule[activeDay]||[];
  if(!evs.length){
    el.innerHTML=`<div class="empty-day">No events yet.<br>Tap <b>+ Add</b> to build this day.</div>`;
    return;
  }
  el.innerHTML=evs.map((ev,i)=>{
    const cat=CATS[ev.cat]||CATS.other;
    const isLast=i===evs.length-1;
    return`<div class="tl-event" onclick="openModal('${ev.id}')">
      <div class="tl-time-col"><span class="tl-time">${fmt12(ev.time)}</span></div>
      <div class="tl-track">
        <div class="tl-dot" style="background:${cat.color}"></div>
        ${!isLast?'<div class="tl-line"></div>':''}
      </div>
      <div class="ev-card" style="border-left:3px solid ${cat.color}">
        <div class="ev-label">${ev.label}</div>
        ${ev.notes?`<div class="ev-notes">${ev.notes}</div>`:''}
      </div>
      <span class="ev-edit">✏️</span>
    </div>`;
  }).join('');
}

function render(){renderStrip();renderTimeline();}
function switchDay(d){activeDay=d;document.getElementById('copy-menu').classList.add('hidden');render();}

// ── COPY MENU ─────────────────────────────────────────────────────────────────
function toggleCopyMenu(){
  const m=document.getElementById('copy-menu');
  m.classList.toggle('hidden');
  if(!m.classList.contains('hidden')){
    m.innerHTML=DAY_KEYS.filter(d=>d!==activeDay).map(d=>
      `<div class="copy-item" onclick="copyFrom('${d}')">Copy from ${d}</div>`
    ).join('');
  }
}
function copyFrom(srcDay){
  if(!confirm(`Replace ${DAY_NAMES[activeDay]}'s schedule with a copy of ${DAY_NAMES[srcDay]}?`))return;
  const uid=()=>Math.random().toString(36).slice(2,8);
  schedule[activeDay]=schedule[srcDay].map(e=>({...e,id:uid()}));
  save();document.getElementById('copy-menu').classList.add('hidden');render();
}
document.addEventListener('click',e=>{
  if(!e.target.closest('#copy-btn')&&!e.target.closest('#copy-menu'))
    document.getElementById('copy-menu').classList.add('hidden');
});

// ── MODAL ─────────────────────────────────────────────────────────────────────
function openModal(id){
  editingId=id;
  const evs=schedule[activeDay]||[];
  const ev=id?evs.find(e=>e.id===id):null;

  const catHtml=Object.entries(CATS).map(([k,v])=>
    `<div class="cat-chip${(ev?.cat||'other')===k?' selected':''}"
      style="background:${v.bg};color:${v.color}"
      data-cat="${k}" onclick="selectCat(this)">${v.label}</div>`
  ).join('');

  document.getElementById('modal').innerHTML=`
    <div class="modal-title">${ev?'Edit Event':'New Event'}</div>
    <div class="field">
      <label>Time</label>
      <input type="time" id="m-time" value="${ev?ev.time:'06:30'}">
    </div>
    <div class="field">
      <label>Label</label>
      <input type="text" id="m-label" placeholder="e.g. Lunch, Gym, Reading" value="${ev?ev.label:''}" maxlength="60">
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="m-notes" placeholder="Details, reminders, targets…">${ev?ev.notes:''}</textarea>
    </div>
    <div class="field">
      <label>Category</label>
      <div class="cat-grid" id="cat-grid">${catHtml}</div>
      <input type="hidden" id="m-cat" value="${ev?ev.cat:'other'}">
    </div>
    <div class="modal-actions">
      ${ev?`<button class="btn btn-danger" onclick="deleteEvent('${ev.id}')">Delete</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEvent()">Save</button>
    </div>`;

  document.getElementById('overlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('m-label').focus(),100);
}

function selectCat(el){
  document.querySelectorAll('.cat-chip').forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('m-cat').value=el.dataset.cat;
}

function saveEvent(){
  const time=document.getElementById('m-time').value;
  const label=document.getElementById('m-label').value.trim();
  const notes=document.getElementById('m-notes').value.trim();
  const cat=document.getElementById('m-cat').value;
  if(!label){document.getElementById('m-label').focus();return;}

  if(!schedule[activeDay])schedule[activeDay]=[];
  if(editingId){
    const ev=schedule[activeDay].find(e=>e.id===editingId);
    if(ev){ev.time=time;ev.label=label;ev.notes=notes;ev.cat=cat;}
  } else {
    const id=Math.random().toString(36).slice(2,8);
    schedule[activeDay].push({id,time,label,notes,cat});
  }
  sortDay(activeDay);
  save();closeModal();render();
}

function deleteEvent(id){
  if(!confirm('Remove this event?'))return;
  schedule[activeDay]=schedule[activeDay].filter(e=>e.id!==id);
  save();closeModal();render();
}

function closeModal(){document.getElementById('overlay').classList.add('hidden');}
function handleOverlayClick(e){if(e.target===document.getElementById('overlay'))closeModal();}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
