<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ze Cookbook · Meal Builder</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-size:15px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;background:#f5f4f0;color:#1c1c1a;line-height:1.5}
button{cursor:pointer;font:inherit;border:none;background:none}
input,select,textarea{font:inherit}
a{color:inherit}

.app{display:flex;flex-direction:column;min-height:100vh}
.header{background:#1a2e1a;color:#e8f5e9;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}
.header h1{font-size:16px;font-weight:600;letter-spacing:-.2px}
.header-meta{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums;margin-top:2px}
.header-cal{font-size:13px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);padding:5px 10px;border-radius:6px;white-space:nowrap}
.nav{display:flex;background:#fff;border-bottom:1px solid #e5e3db;overflow-x:auto;padding:0 20px;gap:2px;flex-shrink:0}
.nav::-webkit-scrollbar{height:0}
.nav button{padding:10px 14px;font-size:13px;color:#6b7280;border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px;transition:color .15s}
.nav button.active{color:#1a2e1a;border-bottom-color:#1a2e1a;font-weight:500}
.nav button:hover:not(.active){color:#374151}
.content{flex:1;padding:20px;max-width:1100px;margin:0 auto;width:100%}
.content-inner{display:none}
.content-inner.show{display:block}

/* CARDS */
.card{background:#fff;border:1px solid #e5e3db;border-radius:10px;padding:16px}
.section-title{font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}

/* MACRO PILLS */
.macro-row{display:flex;gap:8px;margin-bottom:14px}
.macro-pill{flex:1;min-width:60px;background:#f5f4f0;border-radius:8px;padding:10px 8px;text-align:center}
.macro-pill .val{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.macro-pill .lbl{font-size:11px;color:#6b7280;margin-top:1px}
.macro-pill.prot .val{color:#7c3aed}
.macro-pill.carb .val{color:#d97706}
.macro-pill.fat .val{color:#dc2626}
.macro-pill.cal .val{color:#16a34a}

/* PROGRESS */
.prog-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prog-label{font-size:12px;width:60px;color:#6b7280;flex-shrink:0}
.prog-bar{flex:1;height:5px;background:#f0efeb;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .4s ease}
.prog-fill.prot{background:#7c3aed}
.prog-fill.carb{background:#d97706}
.prog-fill.fat{background:#dc2626}
.prog-fill.cal{background:#16a34a}
.prog-val{font-size:11px;min-width:56px;text-align:right;font-variant-numeric:tabular-nums;color:#374151}

/* BUILDER LAYOUT */
.builder-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:680px){.builder-grid{grid-template-columns:1fr}}

/* INGREDIENT LIST */
.ing-search{width:100%;padding:8px 12px;border:1px solid #e5e3db;border-radius:8px;font-size:13px;background:#fff;outline:none;transition:border-color .15s}
.ing-search:focus{border-color:#1a2e1a}
.cat-filter{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 8px}
.cat-btn{padding:3px 9px;font-size:11px;border:1px solid #e5e3db;border-radius:20px;color:#6b7280;background:#fff;transition:all .15s}
.cat-btn.active{background:#1a2e1a;color:#e8f5e9;border-color:#1a2e1a}
.ing-list{max-height:380px;overflow-y:auto;border:1px solid #e5e3db;border-radius:8px}
.ing-list::-webkit-scrollbar{width:4px}
.ing-list::-webkit-scrollbar-thumb{background:#e5e3db;border-radius:2px}
.ing-item{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid #f5f4f0;gap:8px;transition:background .1s}
.ing-item:last-child{border-bottom:none}
.ing-item:hover{background:#fafaf8}
.ing-item.excluded{opacity:.35}
.ing-name{font-size:13px;font-weight:500;flex:1;line-height:1.3}
.ing-sub{font-size:11px;color:#9ca3af;line-height:1.2}
.ing-macros{font-size:11px;color:#6b7280;white-space:nowrap;text-align:right}
.fav-star{color:#d97706;font-size:10px;margin-right:3px}
.add-btn{width:26px;height:26px;border-radius:50%;background:#f0efeb;color:#374151;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;line-height:1}
.add-btn:hover{background:#1a2e1a;color:#e8f5e9}
.in-meal-badge{font-size:10px;color:#16a34a;font-weight:500;margin-left:4px}

/* MEAL ITEMS */
.meal-item{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #f5f4f0}
.meal-item:last-child{border-bottom:none}
.meal-name{flex:1;font-size:13px;font-weight:500}
.qty-input{width:58px;padding:4px 6px;border:1px solid #e5e3db;border-radius:6px;font-size:12px;text-align:center;outline:none}
.qty-input:focus{border-color:#1a2e1a}
.qty-unit{font-size:11px;color:#9ca3af;white-space:nowrap}
.meal-item-macros{font-size:11px;color:#6b7280;min-width:78px;text-align:right}
.rm-btn{color:#dc2626;font-size:16px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;opacity:.5;flex-shrink:0}
.rm-btn:hover{opacity:1;background:#fef2f2}

/* ALERTS */
.alert{padding:9px 12px;border-radius:8px;font-size:12px;margin-bottom:7px;display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.alert.warn{background:#fef9c3;border:1px solid #fde047;color:#713f12}
.alert.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a5f}
.alert.success{background:#f0fdf4;border:1px solid #86efac;color:#14532d}
.alert.danger{background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap}
.btn-primary{background:#1a2e1a;color:#e8f5e9}
.btn-primary:hover{background:#243d24}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{border:1px solid #e5e3db;color:#374151;background:#fff}
.btn-ghost:hover{background:#f5f4f0}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fca5a5}
.btn-danger:hover{background:#fee2e2}

/* DIVIDER */
.divider{border:none;border-top:1px solid #f0efeb;margin:12px 0}

/* SPINNER */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* EMPTY */
.empty{text-align:center;padding:32px 16px;color:#9ca3af;font-size:13px}

/* SAVED CARDS */
.saved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.saved-card{background:#fff;border:1px solid #e5e3db;border-radius:10px;padding:14px;transition:all .15s}
.saved-card:hover{border-color:#1a2e1a;box-shadow:0 2px 8px rgba(26,46,26,.06)}
.saved-card h4{font-size:14px;font-weight:600;margin-bottom:4px}
.saved-card .saved-meta{font-size:11px;color:#9ca3af;margin-bottom:8px}
.saved-macros{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;margin-bottom:10px}

/* PREF TAGS */
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:4px;font-size:12px}
.tag-remove{background:none;border:none;cursor:pointer;font-size:12px;opacity:.6;line-height:1;padding:0 2px}
.tag-remove:hover{opacity:1}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;min-height:26px;margin-top:8px}
.pref-add-row{display:flex;gap:8px;margin-top:8px}
.pref-select{flex:1;padding:7px 10px;border:1px solid #e5e3db;border-radius:6px;font-size:13px;background:#fff;outline:none}

/* AI RESULT */
.ai-result-card{background:#f0fdf4;border:1px solid #86efac;border-radius:10px;padding:16px;margin-top:14px}
.ai-result-card h3{font-size:15px;font-weight:600;color:#14532d;margin-bottom:6px}
.ai-item-row{display:flex;justify-content:space-between;align-items:flex-start;padding:7px 0;border-bottom:1px solid #d1fae5;font-size:13px;gap:8px}
.ai-item-row:last-child{border-bottom:none}
.ai-note{font-size:11px;color:#4b7a5c;margin-top:2px}

/* MICROS */
.micro-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f5f4f0}
.micro-row:last-child{border-bottom:none}
.micro-name{min-width:100px;font-size:13px}
.micro-bar{flex:1;height:5px;background:#f0efeb;border-radius:3px;overflow:hidden}
.micro-bar-fill{height:100%;border-radius:3px;transition:width .4s}
.micro-val{font-size:13px;font-variant-numeric:tabular-nums;font-weight:500;min-width:60px;text-align:right}
.micro-pct{font-size:11px;color:#9ca3af;min-width:52px;text-align:right}

/* GRID */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.grid2{grid-template-columns:1fr}}
</style>
</head>

const MEM = {};
async function sGet(k){
  try{ if(window.storage){ const r=await window.storage.get(k); return r?JSON.parse(r.value):null; } }catch(e){}
  return MEM[k]||null;
}
async function sSet(k,v){
  try{ if(window.storage){ await window.storage.set(k,JSON.stringify(v)); return; } }catch(e){}
  MEM[k]=v;
}
async function persist(){ await sSet('zc-saved',S.saved); await sSet('zc-prefs',S.prefs); await sSet('zc-daily',S.dailyMeals); }
async function loadState(){
  const sv=await sGet('zc-saved'); if(sv) S.saved=sv;
  const pr=await sGet('zc-prefs'); if(pr) S.prefs={...S.prefs,...pr};
  const dl=await sGet('zc-daily'); if(dl) S.dailyMeals=dl;
}

function calcMeal(items){
  let p=0,c=0,f=0,cal=0,fiber=0,sodium=0,potassium=0,vitC=0,iron=0,calcium=0;
  for(const item of items){
    const ing=DB.find(x=>x.id===item.id); if(!ing) continue;
    const m=item.qty||1;
    p+=ing.p*m; c+=ing.c*m; f+=ing.f*m; cal+=ing.cal*m;
    fiber+=ing.fiber*m; sodium+=ing.sodium*m; potassium+=ing.potassium*m;
    vitC+=ing.vitC*m; iron+=ing.iron*m; calcium+=ing.calcium*m;
  }
  return {p,c,f,cal,fiber,sodium,potassium,vitC,iron,calcium};
}
const ri = n => Math.round(n);
const r1 = n => Math.round(n*10)/10;
const pct = (v,t) => Math.min(100,Math.round(v/t*100));

  document.getElementById('tab-'+name).classList.add('show');

}

  if(name==='builder') renderBuilder();
  else if(name==='ai') renderAI();
  else if(name==='saved') renderSaved();

  updateHeader();
}

}

    .sort((a,b)=>{

      return (af&&!bf)?-1:(bf&&!af)?1:a.name.localeCompare(b.name);
    });
  const el=document.getElementById('ing-list'); if(!el) return;
  el.innerHTML=items.map(x=>{

function renderGutFlags(totals){
  const el=document.getElementById('gut-flags'); if(!el||!S.meal.length){if(el)el.innerHTML='';return;}
  const flags=[];
  if(totals.fiber<3) flags.push({type:'warn',msg:'Low fiber. Try adding oats, sweet potato, avocado, or fruit.'});
  if(totals.sodium>700) flags.push({type:'warn',msg:`High sodium: ${ri(totals.sodium)}mg in this meal alone.`});
  const gutFoods=S.meal.some(i=>{ const g=DB.find(x=>x.id===i.id); return g&&g.tags.includes('gut-friendly'); });
  if(!gutFoods&&S.meal.length>2) flags.push({type:'info',msg:'No gut-friendly foods. Consider oats, banana, garlic, onion, kefir, or kombucha.'});
  const hasQualityProtein=S.meal.some(i=>{ const g=DB.find(x=>x.id===i.id); return g&&(g.cat==='Protein'||g.cat==='Supplement'||g.p>8); });
  if(!hasQualityProtein&&totals.cal>150) flags.push({type:'warn',msg:'No quality protein source detected in this meal.'});
  if(totals.cal>1200) flags.push({type:'info',msg:`Large meal: ${ri(totals.cal)} cal. Make sure this fits your day.`});
  el.innerHTML=flags.map(f=>`<div class="alert ${f.type}"><span>${f.type==='warn'?'⚠':'ℹ'}</span><span>${f.msg}</span></div>`).join('');
}

async function runAI(){
  const btn=document.getElementById('ai-btn');
  const prot=document.getElementById('ai-prot')?.value||40;
  const cal=document.getElementById('ai-cal')?.value||700;
  const timing=document.getElementById('ai-timing')?.value||'Lunch';
  const notes=document.getElementById('ai-notes')?.value||'';
  btn.innerHTML=`<span class="spinner"></span> Thinking…`; btn.disabled=true;

  const excluded=S.prefs.excluded;
  const favored=S.prefs.favored;
  const ingList=DB.filter(x=>!excluded.includes(x.id))
    .map(x=>`${x.name} [${x.serving}]: ${x.p}g P, ${x.c}g C, ${x.f}g F, ${x.cal} cal, fiber:${x.fiber}g`)
    .join('\n');
  const favNames=favored.map(id=>DB.find(x=>x.id===id)?.name).filter(Boolean).join(', ');

  const prompt=`You are a sports nutrition expert. Build a single meal for a 157-lb male athlete in a lean bulk (daily targets: ${S.prefs.proteinTarget}g protein, ${S.prefs.calTarget} cal).

Meal timing: ${timing}
Protein target for this meal: ~${prot}g
Calorie target for this meal: ~${cal} cal
${notes?'Notes: '+notes:''}
${favNames?'Prefer using: '+favNames:''}

Use ONLY ingredients from this list. Specify servings as a decimal multiplier of the listed serving size (e.g. 1.5 means 1.5x the listed serving):
${ingList}

Return ONLY valid JSON, no markdown, no explanation:
{"meal_name":"...","timing_note":"one sentence why this meal fits the timing","items":[{"id":"ingredient_id","name":"exact name","servings":1.0,"prep":"short prep note"}],"gut_note":"gut health observation","macros":{"protein":0,"carbs":0,"fat":0,"calories":0}}`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    const text=data.content.filter(x=>x.type==='text').map(x=>x.text).join('');
    const meal=JSON.parse(text.replace(/```json|```/g,'').trim());
    S.lastAIResult=meal;
    renderAIResult(meal);
  }catch(e){
    document.getElementById('ai-result').innerHTML=`<div class="alert danger" style="margin-top:14px">Generation failed: ${e.message}. Check your network and try again.</div>`;
  }
  btn.innerHTML='Generate Meal Suggestion ↗'; btn.disabled=false;
}

    ${meal.items.map(item=>`<div class="ai-item-row">

function loadSaved(id){
  const m=S.saved.find(x=>x.id===id); if(!m) return;
  S.meal=[...m.items];
  setTab('builder',document.querySelector('.nav button'));
}
function deleteSaved(id){ S.saved=S.saved.filter(x=>x.id!==id); persist(); renderSaved(); }
function addSavedToDaily(id){
  const m=S.saved.find(x=>x.id===id); if(!m) return;
  S.dailyMeals.push({...m,id:Date.now()}); persist(); updateHeader(); renderSaved();
}
function removeDailyMeal(id){ S.dailyMeals=S.dailyMeals.filter(x=>x.id!==id); persist(); updateHeader(); renderSaved(); }
function clearDaily(){ S.dailyMeals=[]; persist(); updateHeader(); renderSaved(); }

// ─────────────────────────────────────────────
// PREFERENCES TAB
// ─────────────────────────────────────────────
function renderPrefs(){
  const el=document.getElementById('tab-prefs');
  const {calTarget,proteinTarget,carbTarget,fatTarget,excluded,favored}=S.prefs;
  const unexcluded=DB.filter(x=>!excluded.includes(x.id));
  const unfavored=DB.filter(x=>!favored.includes(x.id));

  el.innerHTML=`<div style="max-width:640px">
  <div class="card" style="margin-bottom:14px">
    <p class="section-title">Daily Macro Targets</p>
    <div class="grid2">
      <div><label style="font-size:12px;color:#6b7280;display:block;margin-bottom:4px">Calories</label>
        <input type="number" id="pref-cal" value="${calTarget}" style="width:100%;padding:8px;border:1px solid #e5e3db;border-radius:6px;font-size:14px;outline:none" onchange="savePref()"></div>
      <div><label style="font-size:12px;color:#6b7280;display:block;margin-bottom:4px">Protein (g)</label>
        <input type="number" id="pref-prot" value="${proteinTarget}" style="width:100%;padding:8px;border:1px solid #e5e3db;border-radius:6px;font-size:14px;outline:none" onchange="savePref()"></div>
      <div><label style="font-size:12px;color:#6b7280;display:block;margin-bottom:4px">Carbs (g)</label>
        <input type="number" id="pref-carb" value="${carbTarget}" style="width:100%;padding:8px;border:1px solid #e5e3db;border-radius:6px;font-size:14px;outline:none" onchange="savePref()"></div>
      <div><label style="font-size:12px;color:#6b7280;display:block;margin-bottom:4px">Fat (g)</label>
        <input type="number" id="pref-fat" value="${fatTarget}" style="width:100%;padding:8px;border:1px solid #e5e3db;border-radius:6px;font-size:14px;outline:none" onchange="savePref()"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <p class="section-title">Favored Foods</p>
    <p style="font-size:12px;color:#6b7280">These appear at the top of your ingredient list and are preferred in AI suggestions.</p>
    <div class="tag-list">${favored.map(id=>{const g=DB.find(x=>x.id===id);return g?`<span class="tag" style="background:#fef3c7;color:#92400e">${g.name}<button class="tag-remove" onclick="removeFav('${id}')">×</button></span>`:''}).join('')}</div>
    <div class="pref-add-row">
      <select id="fav-sel" class="pref-select"><option value="">Add a favored food…</option>${unfavored.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
      <button class="btn btn-ghost btn-sm" onclick="addFav()">Add</button>
    </div>
  </div>

  <div class="card">
    <p class="section-title">Excluded Foods</p>
    <p style="font-size:12px;color:#6b7280">These are dimmed in the library and skipped in AI suggestions.</p>
    <div class="tag-list">${excluded.map(id=>{const g=DB.find(x=>x.id===id);return g?`<span class="tag" style="background:#fef2f2;color:#7f1d1d">${g.name}<button class="tag-remove" onclick="removeExcl('${id}')">×</button></span>`:''}).join('')}</div>
    <div class="pref-add-row">
      <select id="excl-sel" class="pref-select"><option value="">Exclude a food…</option>${unexcluded.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}</select>
      <button class="btn btn-ghost btn-sm" onclick="addExcl()">Exclude</button>
    </div>
  </div>
</div>`;
}

function savePref(){
  S.prefs.calTarget=parseInt(document.getElementById('pref-cal')?.value)||3100;
  S.prefs.proteinTarget=parseInt(document.getElementById('pref-prot')?.value)||170;
  S.prefs.carbTarget=parseInt(document.getElementById('pref-carb')?.value)||420;
  S.prefs.fatTarget=parseInt(document.getElementById('pref-fat')?.value)||53;
  persist(); updateHeader();
}
function addFav(){ const s=document.getElementById('fav-sel'); if(s?.value&&!S.prefs.favored.includes(s.value)){S.prefs.favored.push(s.value);persist();renderPrefs();} }
function removeFav(id){ S.prefs.favored=S.prefs.favored.filter(x=>x!==id); persist(); renderPrefs(); }
function addExcl(){ const s=document.getElementById('excl-sel'); if(s?.value&&!S.prefs.excluded.includes(s.value)){S.prefs.excluded.push(s.value);persist();renderPrefs();} }
function removeExcl(id){ S.prefs.excluded=S.prefs.excluded.filter(x=>x!==id); persist(); renderPrefs(); }

// ─────────────────────────────────────────────
// MICROS TAB
// ─────────────────────────────────────────────
const MICRO_T={fiber:38,sodium:2300,potassium:4700,vitC:90,iron:8,calcium:1000};
const MICRO_L={fiber:'Fiber',sodium:'Sodium',potassium:'Potassium',vitC:'Vitamin C',iron:'Iron',calcium:'Calcium'};
const MICRO_U={fiber:'g',sodium:'mg',potassium:'mg',vitC:'mg',iron:'mg',calcium:'mg'};
const MICRO_F={fiber:r1,sodium:ri,potassium:ri,vitC:ri,iron:r1,calcium:ri};

function microTable(totals,title){
  return `<div class="card" style="margin-bottom:14px">
    <p class="section-title">${title}</p>
    ${Object.keys(MICRO_T).map(k=>{
      const v=totals[k]||0, t=MICRO_T[k], p=pct(v,t);
      const barColor=p>=100?'#16a34a':p>=50?'#d97706':'#dc2626';
      return `<div class="micro-row">
        <span class="micro-name">${MICRO_L[k]}</span>
        <div class="micro-bar"><div class="micro-bar-fill" style="width:${p}%;background:${barColor}"></div></div>
        <span class="micro-val">${MICRO_F[k](v)} <span style="font-size:11px;color:#9ca3af">${MICRO_U[k]}</span></span>
        <span class="micro-pct">${p}% DV</span>
        ${p<40?`<span style="font-size:11px;color:#dc2626;margin-left:4px">▼</span>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

function renderMicros(){
  const el=document.getElementById('tab-micros');
  const mealT=calcMeal(S.meal);
  const dayT=calcMeal(S.dailyMeals.flatMap(m=>m.items));
  const checkT=S.dailyMeals.length?dayT:mealT;

  const gaps=[];
  if((checkT.fiber||0)<15) gaps.push('Fiber — oats, sweet potato, avocado, apple, broccoli');
  if((checkT.vitC||0)<30) gaps.push('Vitamin C — bell peppers, orange, strawberries, broccoli');
  if((checkT.iron||0)<4) gaps.push('Iron — spinach, ground beef, oats');
  if((checkT.potassium||0)<2000) gaps.push('Potassium — potato, banana, avocado, salmon');
  if((checkT.calcium||0)<400) gaps.push('Calcium — kefir, milk, greek yogurt, almonds');

  el.innerHTML=`
  ${!S.meal.length&&!S.dailyMeals.length?`<div class="empty">Add ingredients to the builder or log meals to see your micro breakdown.</div>`:''}
  ${S.meal.length?microTable(mealT,'Current Meal Micros'):''}
  ${S.dailyMeals.length?microTable(dayT,"Today's Total Micros"):''}
  ${gaps.length?`<div class="card">
    <p class="section-title">Gaps to Address</p>
    ${gaps.map(g=>`<div class="alert warn" style="margin-bottom:6px"><span>⚡</span><span><b>${g.split(' —')[0]}</b> is low — ${g.split(' — ')[1]}</span></div>`).join('')}
  </div>`:''}`;
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
(async()=>{
  await loadState();
  renderTab('builder');
})();
</script>
